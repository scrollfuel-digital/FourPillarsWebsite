<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Analytics (GA4) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-ZJCV4Q5BD6"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-ZJCV4Q5BD6");
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo.png" />

    <!-- Website information -->
    <meta name="author" content="4 Pillars Realty" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Auto-refresh on Ctrl+U / View Source key combination -->
    <script>
      (function () {
        function handleKey(e) {
          var isCtrl = e.ctrlKey || e.metaKey;
          var isU =
            (e.key && e.key.toLowerCase() === "u") ||
            e.code === "KeyU" ||
            e.keyCode === 85 ||
            e.which === 85;
          var isMacViewSource = e.metaKey && e.altKey && isU;

          if ((isCtrl && isU) || isMacViewSource) {
            window.location.reload();
          }
        }
        document.addEventListener("keydown", handleKey, true);
        window.addEventListener("keydown", handleKey, true);
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
